<script>
function I(i) { return document.getElementById(i); }

		let SPEEDTEST_SERVERS = "server-list.json";

		//INITIALIZE SPEEDTEST
		var s = new Speedtest(); //create speed test object
		s.setParameter("telemetry_level", "basic"); //enable basic telemetry (for results sharing)

		//SERVER AUTO SELECTION
		function initServers(){
			if (SPEEDTEST_SERVERS.length == 0) { 					//standalone installation
				//just make the UI visible
				I("loading").className = "hidden";
				I("serverArea").style.display = "none";
				I("testWrapper").className = "visible";
				initUI();
			} else { //multiple servers
				var noServersAvailable = function () {
					I("message").innerHTML = "No servers available";
				}
				var runServerSelect=function(){
					s.selectServer(function (server) {
						if (server != null) { //at least 1 server is available
							I("loading").className = "hidden"; //hide loading message
							//sort servers by country, then by city
							//name formats: "City, Country", "City, Country (qualifier)", "City, Country, Provider", "Country"
							function parseServerName(name) {
						let parts = (name || "").split(",");
						for (let p = 0; p < parts.length; p++) parts[p] = parts[p].trim();
						let country, city;
						if (parts.length >= 3) {
							country = parts[1];
							city = parts[0];
						} else if (parts.length === 2) {
							country = parts[1];
							city = parts[0];
						} else {
							country = parts[0];
							city = "";
						}
						country = country.replace(/\s*\([^)]*\)\s*/g, "").trim();
						return { country: country, city: city };
					}
					let indexed = [];
					for (let j = 0; j < SPEEDTEST_SERVERS.length; j++) {
					indexed.push({ idx: j, server: SPEEDTEST_SERVERS[j] });
				}
				indexed.sort(function (a, b) {
					let pa = parseServerName(a.server.name);
					let pb = parseServerName(b.server.name);
					return pa.country.localeCompare(pb.country) || pa.city.localeCompare(pb.city);
				});
				//populate server list for manual selection
							for (let i = 0; i < indexed.length; i++) {
					if (indexed[i].server.pingT == -1) continue;
									let option = document.createElement("option");
									option.value = indexed[i].idx;
									option.textContent = indexed[i].server.name;
									if (indexed[i].server === server) option.selected = true;
								I("server").appendChild(option);
							}
							//show test UI
							I("testWrapper").className="visible";
							initUI();
						}else{ //no servers are available, the test cannot proceed
							noServersAvailable();
						}
					});
				}
				if (typeof SPEEDTEST_SERVERS === "string") {
					//need to fetch list of servers from specified URL
					s.loadServerList(SPEEDTEST_SERVERS, function (servers) {
						if (servers == null) { //failed to load server list
							noServersAvailable();
						} else { //server list loaded
							SPEEDTEST_SERVERS = servers;
							runServerSelect();
						}
					});
				} else {
					//hardcoded server list
					s.addTestPoints(SPEEDTEST_SERVERS);
					runServerSelect();
				}
			}
	}

		//UI CODE
		let uiData=null;
		s.onupdate=function(data){ //callback to update data in UI
			I("ip").textContent=data.clientIp;
			I("dlText").textContent=(data.testState==1&&data.dlStatus==0)?"...":data.dlStatus;
			I("ulText").textContent=(data.testState==3&&data.ulStatus==0)?"...":data.ulStatus;
			I("pingText").textContent=data.pingStatus;
			I("jitText").textContent=data.jitterStatus;
			uiData=data;
		}

		s.onend=function(aborted){ //callback for test ended/aborted
			I("startStopBtn").className=""; //show start button again
			I("server").disabled=false;
			if(!aborted){//if testId is present, show sharing panel, otherwise do nothing
				try{
					const testId=uiData.testId;
					if(testId!=null){
						const shareURL=window.location.href.substring(0,window.location.href.lastIndexOf("/"))+"/results/?id="+testId + "&style=classic";
						I("resultsImg").src=shareURL;
						I("resultsURL").value=shareURL;
						I("testId").innerHTML=testId;
						I("shareArea").style.display="";
					}
				}catch(e){console.warn(e);}
			}else{ //if the test was aborted, clear the UI and prepare for new test
				initUI();
			}
		}

function startStop(){ //start/stop button pressed
	if(s.getState()==3){
		//speed test is running, abort
		s.abort();
		I("startStopBtn").className="";
		I("server").disabled=false;
		initUI();
	}else{
		//test is not running, begin
		I("startStopBtn").className="running";
		I("shareArea").style.display="none";
		I("server").disabled=true;
		s.start();
	}
}

//function to (re)initialize UI
function initUI(){
	I("dlText").textContent="";
	I("ulText").textContent="";
	I("pingText").textContent="";
	I("jitText").textContent="";
	I("ip").textContent="";
}
</script>

<body onload="initServers()">
<h1>SpeedtestHE</h1>
<div id="loading" class="visible">
	<p id="message"><span class="loadCircle"></span>Selecting a server...</p>
</div>
<div id="testWrapper" class="hidden">
	<button id="startStopBtn" onclick="startStop()"></button><br>
	<div id="serverArea">
		Server: <select id="server" onchange="s.setSelectedServer(SPEEDTEST_SERVERS[this.value])"></select>
	</div>
	<div id="test">
		<div class="testGroup">
			<div class="testArea2">
				<div class="testName">Ping</div>
			<div id="pingText" class="meterText"></div>
				<div class="unit">ms</div>
			</div>
			<div class="testArea2">
				<div class="testName">Jitter</div>
			<div id="jitText" class="meterText"></div>
				<div class="unit">ms</div>
			</div>
		</div>
		<div class="testGroup">
			<div class="testArea">
				<div class="testName">Download</div>
				<div id="dlText" class="meterText"></div>
				<div class="unit">Mbit/s</div>
			</div>
			<div class="testArea">
				<div class="testName">Upload</div>
				<div id="ulText" class="meterText"></div>
				<div class="unit">Mbit/s</div>
			</div>
		</div>
		<div id="ipArea">
			<span id="ip"></span>
		</div>
		<div id="shareArea" style="display:none">
			<h3>Share results</h3>
			<p>Test ID: <span id="testId"></span></p>
			<input type="text" value="" id="resultsURL" readonly="readonly" onclick="this.select();this.focus();this.select();document.execCommand('copy');alert('Link copied')">
			<img src="" id="resultsImg">
		</div>
	</div>
	<a href="stability.html">Stability Test</a> | <a href="https://github.com/IRainman/speedtest">Source code</a>
</div>
